# EBB sweep config table — one entry per pipeline.
# Fill in each `postings_url` with the TSP's OWN critical-notices / informational
# postings page (deep link, not the marketing landing page). The morning sweep
# dispatches one scout per pipeline using scout-task-template.md.
#
# postings_url left blank => the scout must discover the page itself (less
# reliable, more prone to landing on the wrong source). Filling these in is what
# makes the sweep trustworthy.

pipelines:
  - name: Transco
    operator: Williams (Transcontinental Gas Pipe Line)
    # CANDIDATE (unverified — portal 403'd automated fetch; confirm in a browser):
    postings_url: "https://www.1line.williams.com/Transco/info-postings/notices/critical-notices.html"

  - name: TETCO
    operator: Enbridge (Texas Eastern Transmission)
    # Enbridge LINK / infopost critical-notices list (bot-blocked to automated fetch):
    postings_url: "https://infopost.enbridge.com/infopost/NoticeListDetail.asp?strKey1=108900&type=CRI&pipe=TE"

  - name: FGT
    operator: Florida Gas Transmission (Energy Transfer)
    # Energy Transfer InfoPost, FGT critical notices (bot-blocked to automated fetch):
    postings_url: "https://fgttransfer.energytransfer.com/ipost/FGT/notice/critical"

  - name: Acadian
    operator: Enterprise Products (Acadian Gas Pipeline)
    # TODO: public EBB URL never resolved. Postings sit behind the Enterprise
    # customer portal (candidate: enterpriseproducts.com/customers/natural-gas/);
    # unconfirmed whether public or login-walled.
    postings_url: ""

  - name: SONAT
    operator: Kinder Morgan (Southern Natural Gas)
    # KM pipeportal / pipeline2 critical-notices index (JS/bot-blocked portal):
    postings_url: "https://pipeline2.kindermorgan.com/Notices/Notices.aspx?type=C&code=SNG"

  - name: Gulf South
    operator: Boardwalk Pipelines (Gulf South Pipeline)
    # Boardwalk infopost EBB, Gulf South tspid=1 (Cloudflare/bot-blocked):
    postings_url: "https://infopost.bwpipelines.com/?tspid=1"

  - name: Eastern Gas Transmission
    operator: Eastern Gas Transmission & Storage (BHE GT&S; formerly Dominion / DETI)
    # EGTS Dekaflow Informational Postings — Critical Notice Calendar lives here
    # (high confidence; legacy dekaflow.dominionenergy.com is now dead, confirming
    # the move to the bhegts.com domain). Bot-blocked to automated fetch.
    postings_url: "https://dekaflow.bhegts.com/jsp/info_post.jsp?company=egts"
    # Secondary front-end (fallback): https://infopost.bhegts.com/egts
    # ⚠ NAME COLLISION: do NOT confuse with Energy Transfer's "EGT" (Delhi, Alto,
    # Byars, Gulf Run, Haynesville) — a different pipeline. Genuine BHE EGTS notices
    # use 7-digit IDs (1,0xx,xxx) and reference TL-400, PL-1, Lebanon CS, Dominion South.
